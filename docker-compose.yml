version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phish_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phish_pass}
      POSTGRES_DB: ${POSTGRES_DB:-phish_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phish_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-phish_user}:${POSTGRES_PASSWORD:-phish_pass}@db:5432/${POSTGRES_DB:-phish_db}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey123}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      RESEARCHER_USERNAME: ${RESEARCHER_USERNAME:-researcher}
      RESEARCHER_PASSWORD: ${RESEARCHER_PASSWORD:-phishsim2024}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data:
